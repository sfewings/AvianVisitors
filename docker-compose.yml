# AvianVisitors as a container. See docs/docker.md for the full walkthrough.
#
#   cp .env.example .env     # then edit it
#   docker compose up -d
#   docker compose logs -f
#
# Collage:            http://<host>:8080/
# Stock BirdNET-Pi UI: http://<host>:8080/index.php

services:
  avianvisitors:
    #image: ghcr.io/twarner491/avianvisitors:latest
    # To build locally instead of pulling, comment out `image:` above and
    # uncomment this. arm64 only: see the header of docker/Dockerfile.
    build:
       context: .
       dockerfile: docker/Dockerfile
    container_name: avianvisitors
    restart: unless-stopped

    # Two Caddy sites. icecast (8000), gotty (8080, 8888) and streamlit (8501)
    # bind to localhost inside the container and are reached through Caddy's
    # reverse proxies, so they are not published.
    ports:
      # The AvianVisitors collage.
      - "80:80"
      # The stock BirdNET-Pi UI, served at "/" on its own port. Only listens
      # when STOCK_UI_PORT is set below; publishing the port with the site
      # disabled is harmless, connections are simply refused.
      - "${STOCK_UI_HOST_PORT:-8081}:8081"

    environment:
      # Anything set here is written into birdnet.conf on every start and wins
      # over edits made in the web UI. Anything left unset stays owned by the
      # UI. Set a value in one place or the other, not both.
      TZ: ${TZ:-UTC}
      SITE_NAME: ${SITE_NAME:-AvianVisitors}
      LATITUDE: ${LATITUDE:?set LATITUDE in .env}
      LONGITUDE: ${LONGITUDE:?set LONGITUDE in .env}

      # Audio source. Leave RTSP_STREAM empty to use the USB mic passed through
      # below; set it to an rtsp:// URL to use a network source instead, in
      # which case the `devices` block becomes unnecessary.
      REC_CARD: ${REC_CARD:-}
      RTSP_STREAM: ${RTSP_STREAM:-}
      CHANNELS: ${CHANNELS:-2}

      # Set these only if you want the live audio stream as well as recording.
      # An ALSA capture device admits one reader, so arecord and ffmpeg cannot
      # both open the mic; ALSA_HW_DEVICE builds a shared dsnoop device and
      # REC_CARD should then be "default". See docs/docker.md.
      ALSA_HW_DEVICE: ${ALSA_HW_DEVICE:-}
      ALSA_HW_CHANNELS: ${ALSA_HW_CHANNELS:-}
      ALSA_HW_RATE: ${ALSA_HW_RATE:-}

      CONFIDENCE: ${CONFIDENCE:-0.7}
      SENSITIVITY: ${SENSITIVITY:-1.25}
      RECORDING_LENGTH: ${RECORDING_LENGTH:-15}

      # Optional. CADDY_PWD turns on basic auth for /scripts, /stream,
      # /terminal, /phpsysinfo and the file browser. Worth setting before you
      # expose this beyond your LAN.
      CADDY_PWD: ${CADDY_PWD:-}
      BIRDNETPI_URL: ${BIRDNETPI_URL:-}

      # Serve the stock BirdNET-Pi UI at "/" on this container port, in addition
      # to the collage on 80. Empty disables the second site entirely. Must match
      # the container side of the port mapping above.
      STOCK_UI_PORT: ${STOCK_UI_PORT:-}
      BIRDWEATHER_ID: ${BIRDWEATHER_ID:-}
      DATABASE_LANG: ${DATABASE_LANG:-en}

      # Optional MQTT bridge (avian/forwarding/mqtt-bridge.py). The service only
      # starts when MQTT_BROKER is non-empty; leave it blank and nothing runs.
      # Unlike the settings above these are NOT written into birdnet.conf: the
      # bridge is a container-level integration, and the broker password has no
      # business in a file the web UI displays.
      MQTT_BROKER: ${MQTT_BROKER:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-birdnet}
      MQTT_POLL_SECONDS: ${MQTT_POLL_SECONDS:-60}

    # USB microphone passthrough. Linux hosts only: Docker Desktop on macOS and
    # Windows has no /dev/snd to forward, so use RTSP_STREAM there instead.
    # Find your card with:  arecord -l   (on the host)
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio

    # Lets the System panel in the admin overlay enumerate USB audio devices.
    # Read-only, and safe to drop if you would rather not expose the USB tree.
    volumes:
      - /dev/bus/usb:/dev/bus/usb:ro

      # Illustrations, photo cutouts and sketches: ~491MB, deliberately not in
      # the image. Read-only because nothing served ever writes here: cutout.php
      # reads the PNGs and writes only to the system temp dir.
      #
      # REQUIRED. The container refuses to start without it, because without
      # illustrations the collage has nothing to draw.
      #
      # Point ASSETS_DIR somewhere else to swap in a different set, e.g. a
      # regional one generated by avian/scripts/pregen.py. Restart picks it up;
      # no rebuild needed.
      - ${ASSETS_DIR:-./avian/assets}:/home/birdnet/BirdNET-Pi/avian/assets:ro

      # birdnet.conf. A bind mount so you can open it in an editor on the host.
      # The container runs as uid 1000; chown the directory to match if your
      # host user differs.
      - ./config:/config

      # Detections database, species lists, notification templates. Small,
      # and the thing you actually want in a backup.
      - ${DATA_DIR:-./data}:/data

      # Audio recordings, extractions and charts. This is the one that grows;
      # point RECORDINGS_DIR at whichever disk has room.
      - ${RECORDINGS_DIR:-./recordings}:/home/birdnet/BirdSongs

    # Raw 15-second captures are written here, analysed, then deleted. On bare
    # metal install_helpers.sh mounts a tmpfs over this path to spare the SD
    # card; the same idea, expressed in compose.
    #
    # Size it deliberately. The default (half of host RAM) will happily consume
    # everything on a 512MB Pi Zero 2W. 200MB holds well over a minute of
    # 48kHz stereo, which is more headroom than the analyser needs.
    tmpfs:
      - /home/birdnet/BirdSongs/StreamData:size=200m,mode=1777,uid=1000,gid=1000

    # tflite inference is the memory high-water mark. Without a cap, a stuck
    # analysis loop can OOM the whole Pi rather than just this container.
    mem_limit: ${MEM_LIMIT:-1500m}

    # sox and ffmpeg are happy to be killed and restarted; the supervisor and
    # Docker's restart policy handle recovery.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# No named volumes: /config, /data and the recordings directory are all host
# paths, so everything the container keeps is visible and backup-able with
# ordinary tools. Bind mounts do not inherit ownership from the image the way a
# fresh named volume does, so avian-container-init takes ownership of each mount
# point at startup (ensure_data_roots).
